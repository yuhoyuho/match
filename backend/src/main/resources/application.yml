spring:
  application:
    name: realmatch-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:55432}/${DB_NAME:realmatch}
    username: ${DB_USERNAME:realmatch}
    password: ${DB_PASSWORD:realmatch}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      repositories:
        enabled: false
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6380}

  docker:
    compose:
      enabled: ${DOCKER_COMPOSE_ENABLED:true}
      lifecycle-management: start_and_stop

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

realmatch:
  web:
    cors:
      allowed-origins:
        - ${FRONTEND_ORIGIN:http://localhost:5173}
  security:
    access-token-ttl-minutes: ${ACCESS_TOKEN_TTL_MINUTES:30}
    refresh-token-ttl-days: ${REFRESH_TOKEN_TTL_DAYS:30}
  coin:
    default-currency: KRW
