services:
  postgres:
    image: 'postgres:16-alpine'
    environment:
      POSTGRES_DB: realmatch
      POSTGRES_PASSWORD: realmatch
      POSTGRES_USER: realmatch
    ports:
      - '${POSTGRES_PORT:-55432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U realmatch -d realmatch']
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: 'redis:7-alpine'
    ports:
      - '${REDIS_PORT:-6380}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
